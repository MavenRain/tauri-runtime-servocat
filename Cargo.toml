[package]
name = "tauri-runtime-servocat"
version = "3.6.0"
edition = "2024"
description = "Servo-replacement runtime for Tauri: wires html-cat, css-cat, dom-cat, layout-cat, paint-cat, net-cat, boa-cat, ecma-runtime-cat, and web-api-cat into a single rendering + scripting pipeline.  v3.6.0 wires the v0.3 `web-api-cat::{set_document_cookie, get_document_cookie}` helpers into `WebviewState::eval`: before each script the JS-visible portion of the jar (non-`HttpOnly`, non-expired entries) is pushed into `document.cookie`; after the script, any JS write is parsed via `Cookie::split_parse` and merged back by name.  `HttpOnly` cookies are now hidden from `document.cookie` while still being sent on the wire (per RFC 6265 §5.2.6).  The Servo no-AI policy disqualifies upstream contribution; this is the AI-built parallel."
license = "MIT OR Apache-2.0"
keywords = ["tauri", "runtime", "browser", "servo", "type-driven"]
categories = ["gui", "rendering"]

[dependencies]
html-cat = "0.1"
css-cat = "0.1"
dom-cat = "0.1"
layout-cat = "0.1"
paint-cat = "0.2"
net-cat = "0.1"
boa-cat = "0.2"
ecma-runtime-cat = "0.1"
web-api-cat = "0.3"
ecma-lex-cat = "0.1"
ecma-parse-cat = "0.1"
tiny-skia = "0.12"
cosmic-text = "0.19"
winit = "0.30"
softbuffer = "0.4"
tauri-runtime = "2"
tauri-utils = "2"
raw-window-handle = "0.6"
url = "2"
http = "1"
cookie = "0.18"
percent-encoding = "2"

[dev-dependencies]
proptest = "1"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
manual_map = "warn"
