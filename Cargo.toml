[package]
name = "tauri-runtime-servocat"
version = "3.17.0"
edition = "2024"
description = "Servo-replacement runtime for Tauri: wires html-cat, css-cat, dom-cat, layout-cat, paint-cat, net-cat, boa-cat, ecma-runtime-cat, and web-api-cat into a single rendering + scripting pipeline.  v3.17.0 pulls in the web-api-cat 0.7 chapter (boa-cat 0.7 -> 0.7.1, web-api-cat 0.6 -> 0.7.4): user-supplied webview scripts now have addEventListener / removeEventListener / dispatchEvent with bubble dispatch up the parent chain, localStorage / sessionStorage Storage-shaped objects, Promise-based fetch (`await fetch(url)` + `r.text()` + HTTPS via rustls), and an inline `style=\"...\"` round-trip that reaches layout-cat through extract_document.  No tauri-runtime-servocat source change beyond the manifest -- the dep bump exposes the new surface to scripts uniformly."
license = "MIT OR Apache-2.0"
keywords = ["tauri", "runtime", "browser", "servo", "type-driven"]
categories = ["gui", "rendering"]

[dependencies]
html-cat = "0.1"
css-cat = "0.1"
dom-cat = "0.1"
layout-cat = "0.1"
paint-cat = "0.2"
net-cat = { version = "0.3", features = ["tls"] }
boa-cat = "0.7.1"
ecma-runtime-cat = "0.3.1"
web-api-cat = "0.7.4"
ecma-lex-cat = "0.1"
ecma-parse-cat = "0.3"
tiny-skia = "0.12"
cosmic-text = "0.19"
winit = "0.30"
softbuffer = "0.4"
tauri-runtime = "2"
tauri-utils = "2"
raw-window-handle = "0.6"
url = "2"
http = "1"
cookie = "0.18"
percent-encoding = "2"

[dev-dependencies]
proptest = "1"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
manual_map = "warn"
