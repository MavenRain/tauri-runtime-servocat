[package]
name = "tauri-runtime-servocat"
version = "3.14.0"
edition = "2024"
description = "Servo-replacement runtime for Tauri: wires html-cat, css-cat, dom-cat, layout-cat, paint-cat, net-cat, boa-cat, ecma-runtime-cat, and web-api-cat into a single rendering + scripting pipeline.  v3.14.0 adds a globally-bound `invoke(cmd, ...args)` shorthand alongside the existing `__TAURI__.invoke` / `__TAURI__.cmd(...)` paths: `HostCommands::install` snapshots the registry into a per-thread `INVOKE_REGISTRY` and installs a top-level `invoke` `NativeFn` that dispatches via the snapshot, so `invoke('greet', 'x')` and `const i = invoke; i('greet', 'x')` both work without a `this` binding."
license = "MIT OR Apache-2.0"
keywords = ["tauri", "runtime", "browser", "servo", "type-driven"]
categories = ["gui", "rendering"]

[dependencies]
html-cat = "0.1"
css-cat = "0.1"
dom-cat = "0.1"
layout-cat = "0.1"
paint-cat = "0.2"
net-cat = { version = "0.3", features = ["tls"] }
boa-cat = "0.3"
ecma-runtime-cat = "0.2"
web-api-cat = "0.4"
ecma-lex-cat = "0.1"
ecma-parse-cat = "0.2"
tiny-skia = "0.12"
cosmic-text = "0.19"
winit = "0.30"
softbuffer = "0.4"
tauri-runtime = "2"
tauri-utils = "2"
raw-window-handle = "0.6"
url = "2"
http = "1"
cookie = "0.18"
percent-encoding = "2"

[dev-dependencies]
proptest = "1"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
manual_map = "warn"
