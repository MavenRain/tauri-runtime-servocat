[package]
name = "tauri-runtime-servocat"
version = "3.32.0"
edition = "2024"
description = "Servo-replacement runtime for Tauri: wires html-cat, css-cat, dom-cat, layout-cat, paint-cat, net-cat, boa-cat, ecma-runtime-cat, and web-api-cat into a single rendering + scripting pipeline.  v3.32.0 lights up the image pipeline that v0.7.20's accessor pack was set up for: `render_with_inline_assets` walks the DOM for `<img>` elements with `data:image/png;base64,...` src attributes, decodes each (via the `png` crate + base64 decode), and attaches a `NodeId -> DecodedImage` map to the Frame.  The tiny-skia rasterizer walks the layout tree, finds each `<img>` box, and stamps the decoded pixels (premultiplied on copy, bilinear scaling to the box rect).  File-path and HTTP image sources are silently skipped for now -- follow-ups will add filesystem and net-cat fetch paths.  Seventh sub-crate of a Servo-replacement webview runtime targeting Tauri."
license = "MIT OR Apache-2.0"
keywords = ["tauri", "runtime", "browser", "servo", "type-driven"]
categories = ["gui", "rendering"]

[dependencies]
html-cat = "0.1"
css-cat = "0.1"
dom-cat = "0.1"
layout-cat = "0.1"
paint-cat = "0.2"
net-cat = { version = "0.3", features = ["tls"] }
boa-cat = "0.7.2"
ecma-runtime-cat = "0.3.1"
web-api-cat = "0.7.20"
ecma-lex-cat = "0.1"
ecma-parse-cat = "0.3"
tiny-skia = "0.12"
png = "0.17"
base64 = "0.22"
cosmic-text = "0.19"
winit = "0.30"
softbuffer = "0.4"
tauri-runtime = "2"
tauri-utils = "2"
raw-window-handle = "0.6"
url = "2"
http = "1"
cookie = "0.18"
percent-encoding = "2"

[dev-dependencies]
proptest = "1"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
manual_map = "warn"
