[package]
name = "tauri-runtime-servocat"
version = "3.28.0"
edition = "2024"
description = "Servo-replacement runtime for Tauri: wires html-cat, css-cat, dom-cat, layout-cat, paint-cat, net-cat, boa-cat, ecma-runtime-cat, and web-api-cat into a single rendering + scripting pipeline.  v3.28.0 picks up web-api-cat 0.7.15: the `:not(selector)` negation pseudo-class is now reachable from user-supplied webview scripts via `querySelector`, `querySelectorAll`, `matches`, and `closest`.  The argument is a full SelectorList so `:not(.foo, .bar)` (Selectors Level 3 list arg) and `:not(:not(.foo))` (Selectors Level 4 nested negation) both work via balanced-paren scanning.  No tauri-runtime-servocat source change beyond the manifest.  Seventh sub-crate of a Servo-replacement webview runtime targeting Tauri."
license = "MIT OR Apache-2.0"
keywords = ["tauri", "runtime", "browser", "servo", "type-driven"]
categories = ["gui", "rendering"]

[dependencies]
html-cat = "0.1"
css-cat = "0.1"
dom-cat = "0.1"
layout-cat = "0.1"
paint-cat = "0.2"
net-cat = { version = "0.3", features = ["tls"] }
boa-cat = "0.7.2"
ecma-runtime-cat = "0.3.1"
web-api-cat = "0.7.15"
ecma-lex-cat = "0.1"
ecma-parse-cat = "0.3"
tiny-skia = "0.12"
cosmic-text = "0.19"
winit = "0.30"
softbuffer = "0.4"
tauri-runtime = "2"
tauri-utils = "2"
raw-window-handle = "0.6"
url = "2"
http = "1"
cookie = "0.18"
percent-encoding = "2"

[dev-dependencies]
proptest = "1"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
manual_map = "warn"
