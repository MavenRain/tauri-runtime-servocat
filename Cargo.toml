[package]
name = "tauri-runtime-servocat"
version = "2.2.0"
edition = "2024"
description = "Servo-replacement runtime for Tauri: wires html-cat, css-cat, dom-cat, layout-cat, paint-cat, net-cat, boa-cat, ecma-runtime-cat, and web-api-cat into a single rendering + scripting pipeline.  v2.2.0 closes the cookie loop: `http://` navigates now parse `Set-Cookie` response headers and merge them into the webview's jar (replace-by-name semantics), so a navigation that sets a cookie persists for the next request without the host having to call `set_cookie` from Rust.  The Servo no-AI policy disqualifies upstream contribution; this is the AI-built parallel."
license = "MIT OR Apache-2.0"
keywords = ["tauri", "runtime", "browser", "servo", "type-driven"]
categories = ["gui", "rendering"]

[dependencies]
html-cat = "0.1"
css-cat = "0.1"
dom-cat = "0.1"
layout-cat = "0.1"
paint-cat = "0.1"
net-cat = "0.1"
boa-cat = "0.2"
ecma-runtime-cat = "0.1"
web-api-cat = "0.2"
ecma-lex-cat = "0.1"
ecma-parse-cat = "0.1"
tiny-skia = "0.12"
cosmic-text = "0.19"
winit = "0.30"
softbuffer = "0.4"
tauri-runtime = "2"
tauri-utils = "2"
raw-window-handle = "0.6"
url = "2"
http = "1"
cookie = "0.18"
percent-encoding = "2"

[dev-dependencies]
proptest = "1"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
manual_map = "warn"
